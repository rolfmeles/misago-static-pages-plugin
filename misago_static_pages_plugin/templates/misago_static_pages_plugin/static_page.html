{% extends "misago/base.html" %}
{% load static i18n misago_absoluteurl %}

{% block title %}{{ title }} | {{ block.super }}{% endblock %}

{% block content %}

<div class="static-page">
  <div class="container page-header-container">
    <div class="page-header page-header-static-page">
      <div class="page-header-bg-image">
        <div class="page-header-bg-overlay">
          <div class="page-header-image"></div>
          <div class="page-header-banner page-header-banner-static-page">
            <div class="page-header-banner-bg-image">
              <div class="page-header-banner-bg-overlay">
                <h1>{{ page.title }}</h1>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="static-page-body container page-container">
    <article class="misago-markup">
      {{ page.content|safe }}
    </article>
  </div>
</div>
{% endblock content %}
